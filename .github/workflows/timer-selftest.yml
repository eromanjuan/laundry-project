name: Timer Self-Test (temporary)

# TEMPORARY — verifies that an expired wash/dry cycle really does raise a staff
# alert via push-sync, then removes everything it created.
#
# Why this exists: the timer sweep only runs inside push-sync/index.js, which
# needs the service-account secret. Secrets can't be read back locally, so the
# only honest way to exercise that code path is to run it here.
#
# It seeds one synthetic order in Washing with a timer that expired a minute
# ago, runs the real sweep, asserts the alert appeared, then deletes both
# documents. Safe to re-run.

on:
  workflow_dispatch: {}

concurrency:
  group: timer-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: push-sync
        run: npm install --no-audit --no-fund

      - name: Seed an expired cycle and run the real sweep
        working-directory: push-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: https://laundry-project-pos.web.app
        run: |
          set -euo pipefail
          node -e '
            const admin = require("firebase-admin")
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) })
            const db = admin.firestore()
            ;(async () => {
              // Any active shop will do — the sweep filters on status, not shop.
              const shops = await db.collection("shops").limit(1).get()
              if (shops.empty) throw new Error("no shop found")
              const shopId = shops.docs[0].id
              const id = "#SELFTEST"
              const endsAt = Date.now() - 60_000
              await db.collection("orders").doc("selftest-order").set({
                id, shopId, customer: "SELF TEST", service: "Self test",
                status: "Washing", paymentStatus: "Pending", amount: "₱0",
                washTimerMinutes: 40, washTimerEndsAt: endsAt, washTimerNotifiedAt: null,
                createdAt: Date.now(),
              })
              console.log("seeded order for shop " + shopId)

              require("./index.js")
            })().catch((e) => { console.error(e); process.exit(1) })
          '

          sleep 5

      - name: Assert the alert fired, then clean up
        working-directory: push-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
            const admin = require("firebase-admin")
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) })
            const db = admin.firestore()
            ;(async () => {
              const alerts = await db.collection("staffAlerts").where("orderId", "==", "#SELFTEST").get()
              console.log("alerts found: " + alerts.size)
              let failed = false
              if (alerts.empty) {
                console.error("FAIL: the sweep did not raise an alert for the expired cycle")
                failed = true
              } else {
                const a = alerts.docs[0].data()
                console.log("alert kind:   " + a.kind)
                console.log("alert title:  " + a.title)
                console.log("alert body:   " + a.body)
                if (a.kind !== "timer-done") { console.error("FAIL: wrong kind"); failed = true }
                if (!a.shopId) { console.error("FAIL: no shopId"); failed = true }
              }

              // The order must be stamped as alerted, and must NOT have advanced.
              const order = await db.collection("orders").doc("selftest-order").get()
              const o = order.data() || {}
              console.log("order status after sweep: " + o.status)
              if (!o.washTimerNotifiedAt) { console.error("FAIL: cycle was not stamped as alerted"); failed = true }
              if (o.status !== "Washing") { console.error("FAIL: the sweep advanced the order, which it must never do"); failed = true }

              // Cleanup, always.
              await db.collection("orders").doc("selftest-order").delete()
              const del = await db.collection("staffAlerts").where("orderId", "==", "#SELFTEST").get()
              for (const d of del.docs) await d.ref.delete()
              console.log("cleaned up order + " + del.size + " alert(s)")

              // Confirm nothing is left behind.
              const left = await db.collection("staffAlerts").where("orderId", "==", "#SELFTEST").get()
              console.log(left.empty ? "PASS: no residue" : "FAIL: residue remains")
              if (!left.empty) failed = true

              process.exit(failed ? 1 : 0)
            })().catch((e) => { console.error(e); process.exit(1) })
          '